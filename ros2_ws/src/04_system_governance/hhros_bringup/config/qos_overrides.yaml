# Authoritative DDS QoS contract for the production ROS graph.
#
# This is a ROS 2 parameter file, not documentation. Every first-party endpoint
# on a topic below must opt in through QosOverridingOptions, and every launch in
# hhros_bringup injects this file into the node that owns that endpoint. Change
# QoS policy values here only; do not duplicate them in source or launch files.
# The 500 Hz joint command path inside ros2_control is an in-process pointer path
# and is therefore intentionally outside this DDS contract.
/**:
  ros__parameters:
    qos_overrides:
      /joint_states:
        publisher:
          history: keep_last
          depth: 1
          reliability: best_effort
          durability: volatile
        subscription:
          history: keep_last
          depth: 1
          reliability: best_effort
          durability: volatile
      /imu/data:
        publisher:
          history: keep_last
          depth: 1

                     0.122, 0.0,  0.0,  0.244,  0.122, 0.0,
                     0.0, 0.0,
                     0.0, -1.20, 0.0, 0.56,
                     0.0,  1.20, 0.0, -0.56]
  # Policy order follows sim2sim's 22-joint MuJoCo model. Deployment still
  # publishes the 23-slot ROS contract, so head_yaw_joint is skipped here and

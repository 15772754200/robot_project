                        100.0,  100.0,  100.0,  100.0,  100.0,  100.0,
                        100.0,  100.0,
                        100.0,  100.0,  100.0,  100.0,
                        100.0,  100.0,  100.0,  100.0]
  kp: [150.0, 50.0, 50.0, 150.0, 25.0, 25.0,
       150.0, 50.0, 50.0, 150.0, 25.0, 25.0,
       120.0, 160.0, 0.0,
       120.0, 110.0, 160.0, 50.0,
       120.0, 110.0, 160.0, 50.0]
  kd: [16.0, 5.0, 5.0, 16.0, 2.0, 2.0,
       16.0, 5.0, 5.0, 16.0, 2.0, 2.0,
       4.0, 3.0, 0.0,
       5.0, 5.0, 3.0, 2.0,
       5.0, 5.0, 3.0, 2.0]
  num_of_dofs: 22
  action_scale: [0.25, 0.27, 0.30, 0.25, 0.45, 0.45,
                 0.25, 0.27, 0.30, 0.25, 0.45, 0.45,
                 0.0875, 0.065625,
                 0.0479166667, 0.0522727273, 0.01296875, 0.0415,
                 0.0479166667, 0.0522727273, 0.01296875, 0.0415]
  wheel_indices: []
  lin_vel_scale: 1.0
  ang_vel_scale: 1.0
  dof_pos_scale: 1.0
  dof_vel_scale: 1.0
  commands_scale: [1.0, 1.0, 1.0]
  torque_limits: [150.0, 54.0, 60.0, 150.0, 45.0, 45.0,
                  150.0, 54.0, 60.0, 150.0, 45.0, 45.0,
                  42.0, 42.0,
                  23.0, 23.0, 8.3, 8.3,
                  23.0, 23.0, 8.3, 8.3]

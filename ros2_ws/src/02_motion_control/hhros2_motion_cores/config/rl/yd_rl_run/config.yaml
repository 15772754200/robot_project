

YD/YD_rl_run:
  model_name: "6.291.onnx"
  # Standalone sim2sim_onnx_mujoco1.py policy contract:
  # one frame = ang_vel(3) + gravity_vec(3) + commands(3) +
  # dof_pos(22) + dof_vel(22) + actions(22) = 75.
  num_observations: 75
  observations: ["ang_vel", "gravity_vec", "commands", "dof_pos", "dof_vel", "actions"]

  observation_stack: 4
  observation_stack_mode: 0 # Match sim2sim history reset: repeat current frame.
  cycle_time: 0.8
  clip_obs: 100.0
  clip_actions_lower: [-100.0, -100.0, -100.0, -100.0, -100.0, -100.0,
                       -100.0, -100.0, -100.0, -100.0, -100.0, -100.0,
                       -100.0, -100.0,
                       -100.0, -100.0, -100.0, -100.0,
                       -100.0, -100.0, -100.0, -100.0]
